<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 268" width="830" height="268" role="img" aria-label="请求状态机：WAITING 被调度后进入 RUNNING；KV 块不够时被抢占回到队列；结束分为遇到结束符、到长度上限、客户端断开三种"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="24" y="30" class="t2t-s" font-size="18.8" fill="#1A1A1A" text-anchor="start" font-weight="700" >一条请求的状态</text><text x="24" y="52" class="t2t-s" font-size="14.2" fill="#6B7280" text-anchor="start" font-weight="400" >PREEMPTED 之后的状态都算已结束，判断就是一个大小比较</text><rect x="30" y="96" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="105.0" y="128.0" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >WAITING</text><rect x="240" y="96" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="315.0" y="128.0" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >RUNNING</text><rect x="240" y="184" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.2" /><text x="315.0" y="216.0" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >PREEMPTED</text><rect x="430" y="62" width="248" height="50" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="554.0" y="93.0" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >FINISHED_STOPPED</text><rect x="430" y="124" width="248" height="50" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="554.0" y="155.0" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >FINISHED_LENGTH_CAPPED</text><rect x="430" y="186" width="248" height="50" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="554.0" y="217.0" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >FINISHED_ABORTED</text><path d="M180 122.0L232 122.0" stroke="#76B900" stroke-width="1.6" fill="none" marker-end="url(#qa)"/><text x="210.0" y="106.0" class="t2t-s" font-size="13.8" fill="#76B900" text-anchor="middle" font-weight="400" >被调度选中</text><path d="M315.0 148L315.0 176" stroke="#F5A623" stroke-width="1.6" fill="none" marker-end="url(#qa)"/><text x="327.0" y="170.0" class="t2t-s" font-size="13.8" fill="#F5A623" text-anchor="start" font-weight="400" >KV 块不够，被抢占</text><path d="M240 210.0H105.0V154" stroke="#F5A623" stroke-width="1.6" fill="none" marker-end="url(#qa)"/><text x="113.0" y="200.0" class="t2t-s" font-size="13.8" fill="#F5A623" text-anchor="start" font-weight="400" >块已释放，重新排队</text><path d="M390 108.0L422 87.0" stroke="#6B7280" stroke-width="1.6" fill="none" marker-end="url(#qa)"/><path d="M390 122.0L422 149.0" stroke="#6B7280" stroke-width="1.6" fill="none" marker-end="url(#qa)"/><path d="M390 136.0L422 211.0" stroke="#6B7280" stroke-width="1.6" fill="none" marker-end="url(#qa)"/><text x="688" y="92.0" class="t2t-s" font-size="13.8" fill="#6B7280" text-anchor="start" font-weight="400" >遇到结束符</text><text x="688" y="154.0" class="t2t-s" font-size="13.8" fill="#6B7280" text-anchor="start" font-weight="400" >到长度上限</text><text x="688" y="216.0" class="t2t-s" font-size="13.8" fill="#6B7280" text-anchor="start" font-weight="400" >客户端断开</text></svg>
