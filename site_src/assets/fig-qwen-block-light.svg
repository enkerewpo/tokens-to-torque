<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="700" height="950" role="img" aria-label="一个 decoder 块：输入先归一化再过 mixer，结果加回输入；再归一化过 SwiGLU 前馈网络，再加回一次。8 层用 self_attn，24 层用 linear_attn"><style>.m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 1 10 5.5 0 10z" fill="#6B7280"/></marker></defs><text x="30" y="32" class="s" font-size="16" fill="#1A1A1A" text-anchor="start" font-weight="700" >一个 decoder 块的内部</text><text x="30" y="54" class="s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >两种层的骨架完全一样，只有中间的 mixer 不同</text><circle cx="190.0" cy="149" r="3.5" fill="#6B7280"/><path d="M190.0 149H26V341.0H165.0" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#qa)"/><circle cx="190.0" cy="369" r="3.5" fill="#6B7280"/><path d="M190.0 369H26V561.0H165.0" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#qa)"/><rect x="40" y="82" width="300" height="54" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="190.0" y="107" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >输入 h</text><text x="190.0" y="126" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><rect x="40" y="162" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="190.0" y="192.5" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >input_layernorm</text><path d="M190.0 136V152" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="40" y="238" width="300" height="62" rx="8" fill="#F5F6F8" stroke="#76B900" stroke-width="1.2" /><text x="190.0" y="263" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >mixer</text><text x="190.0" y="282" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >见右边两种</text><path d="M190.0 212V228" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><circle cx="190.0" cy="341.0" r="15" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/><text x="190.0" y="347.0" class="s" font-size="18" fill="#1A1A1A" text-anchor="middle" font-weight="700" >+</text><path d="M190.0 300V316" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="40" y="382" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="190.0" y="412.5" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >post_attention_layernorm</text><path d="M190.0 356V372" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="40" y="458" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="190.0" y="483" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >mlp</text><text x="190.0" y="502" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >SwiGLU，见下方展开</text><path d="M190.0 432V448" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><circle cx="190.0" cy="561.0" r="15" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/><text x="190.0" y="567.0" class="s" font-size="18" fill="#1A1A1A" text-anchor="middle" font-weight="700" >+</text><path d="M190.0 520V536" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="40" y="602" width="300" height="54" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="190.0" y="627" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >输出 h</text><text x="190.0" y="646" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><path d="M190.0 576V592" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="372" y="96" width="300" height="174" rx="10" fill="#F5F6F8" stroke="#F5A623" stroke-width="1.2" /><text x="386" y="121" class="s" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >self_attn</text><text x="658" y="121" class="s" font-size="13.5" fill="#F5A623" text-anchor="end" font-weight="700" >32 层里的 8 层</text><text x="388" y="143" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >q_proj</text><text x="656" y="143" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 8192</text><text x="388" y="164" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >k_proj   v_proj</text><text x="656" y="164" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 1024</text><text x="388" y="185" class="m" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400" >q_norm  k_norm</text><text x="656" y="185" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >无权重矩阵</text><text x="388" y="206" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >o_proj</text><text x="656" y="206" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="388" y="241" class="s" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400" >16 个查询头 / 4 组 KV，每头 256 维</text><text x="388" y="258" class="s" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400" >q_proj 宽一倍：它同时输出一路门控</text><rect x="372" y="304" width="300" height="195" rx="10" fill="#F5F6F8" stroke="#0074C8" stroke-width="1.2" /><text x="386" y="329" class="s" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >linear_attn</text><text x="658" y="329" class="s" font-size="13.5" fill="#0074C8" text-anchor="end" font-weight="700" >另外 24 层</text><text x="388" y="351" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_qkv</text><text x="656" y="351" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 8192</text><text x="388" y="372" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_z</text><text x="656" y="372" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="388" y="393" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_a   in_proj_b</text><text x="656" y="393" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 32</text><text x="388" y="414" class="m" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400" >conv1d(k=4)  norm</text><text x="656" y="414" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >不挂 LoRA</text><text x="388" y="435" class="m" font-size="13" fill="#76B900" text-anchor="start" font-weight="400" >out_proj</text><text x="656" y="435" class="m" font-size="12" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="388" y="470" class="s" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400" >GatedDeltaNet：一维卷积 +</text><text x="388" y="487" class="s" font-size="12" fill="#6B7280" text-anchor="start" font-weight="400" >一个随位置递推更新的状态</text><path d="M340 269.0H356.0V183.0H362" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><path d="M340 269.0H356.0V401.5H362" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="696" width="640" height="186" rx="12" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="46" y="722" class="s" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >mlp 展开：SwiGLU</text><rect x="50" y="756" width="96" height="54" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="98.0" y="781" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >h</text><text x="98.0" y="800" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><rect x="202" y="738" width="138" height="54" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="271.0" y="763" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >gate_proj</text><text x="271.0" y="782" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="202" y="800" width="138" height="54" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="271.0" y="825" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >up_proj</text><text x="271.0" y="844" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="370" y="742" width="80" height="46" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="410.0" y="770.5" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >SiLU</text><circle cx="499.0" cy="823.0" r="15" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/><text x="499.0" y="829.0" class="s" font-size="17" fill="#1A1A1A" text-anchor="middle" font-weight="700" >×</text><rect x="544" y="800" width="138" height="54" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="613.0" y="825" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >down_proj</text><text x="613.0" y="844" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 4096</text><path d="M146 783.0H168" stroke="#6B7280" stroke-width="1.8"/><path d="M168 765.0V827.0" stroke="#6B7280" stroke-width="1.8"/><path d="M168 765.0H192" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M168 827.0H192" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M340 765.0H360" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M450 765.0H499.0V798" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M340 827.0H474" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M514 823.0H534" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><text x="46" y="868" class="s" font-size="12.5" fill="#6B7280" text-anchor="start" font-weight="400" >两条并行的线性变换，一条过 SiLU 当门，逐元素乘另一条，再投回 4096。</text><text x="30" y="910" class="s" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400" >虚线 = 残差连接：把模块的输出加回它自己的输入。</text><text x="30" y="930" class="s" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400" >绿色 = nn.Linear，LoRA 挂点；灰色是归一化、卷积、激活，没有权重矩阵可拆。</text></svg>
