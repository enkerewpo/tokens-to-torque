<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1074" width="750" height="1074" role="img" aria-label="一个 decoder 块：输入先归一化再过 mixer，结果加回输入；再归一化过 SwiGLU 前馈网络，再加回一次。8 层用 self_attn，24 层用 linear_attn"><style>.m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="30" y="34" class="s" font-size="18.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >一个 decoder 块的内部</text><text x="30" y="54" class="s" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="400" >两种层的骨架完全一样，只有中间的 mixer 不同</text><circle cx="36" cy="113.0" r="3.5" fill="#6B7280"/><path d="M36 113.0H14V388.0H170.0" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qa)"/><circle cx="170.0" cy="388.0" r="3.5" fill="#6B7280"/><path d="M170.0 388.0H14V648.0H170.0" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qa)"/><rect x="36" y="82" width="300" height="62" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="186.0" y="110" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >输入 h</text><text x="186.0" y="132" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><rect x="36" y="178" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="186.0" y="212.0" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >input_layernorm</text><path d="M186.0 144V178" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="36" y="268" width="300" height="70" rx="8" fill="#F5F6F8" stroke="#76B900" stroke-width="1.2" /><text x="186.0" y="296" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >mixer</text><text x="186.0" y="318" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >见右边两种</text><path d="M186.0 234V268" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><circle cx="186.0" cy="388.0" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/><text x="186.0" y="395.0" class="s" font-size="20.4" fill="#1A1A1A" text-anchor="middle" font-weight="700" >+</text><path d="M186.0 338V372" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="36" y="438" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="186.0" y="472.0" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >post_attention_layernorm</text><path d="M186.0 404V428" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="36" y="528" width="300" height="70" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="186.0" y="556" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >mlp</text><text x="186.0" y="578" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >SwiGLU，见下方展开</text><path d="M186.0 494V528" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><circle cx="186.0" cy="648.0" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/><text x="186.0" y="655.0" class="s" font-size="20.4" fill="#1A1A1A" text-anchor="middle" font-weight="700" >+</text><path d="M186.0 598V632" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="36" y="698" width="300" height="62" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="186.0" y="726" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >输出 h</text><text x="186.0" y="748" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><path d="M186.0 664V688" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="396" y="96" width="322" height="196" rx="10" fill="#F5F6F8" stroke="#F5A623" stroke-width="1.2" /><text x="410" y="123" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >self_attn</text><text x="704" y="123" class="s" font-size="15.0" fill="#F5A623" text-anchor="end" font-weight="700" >32 层里的 8 层</text><text x="412" y="148" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >q_proj</text><text x="702" y="148" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 8192</text><text x="412" y="172" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >k_proj   v_proj</text><text x="702" y="172" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 1024</text><text x="412" y="196" class="m" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="400" >q_norm  k_norm</text><text x="702" y="196" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >无权重矩阵</text><text x="412" y="220" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >o_proj</text><text x="702" y="220" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="412" y="260" class="s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >16 个查询头 / 4 组 KV，每头 256 维</text><text x="412" y="279" class="s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >q_proj 宽一倍：它同时输出一路门控</text><rect x="396" y="322" width="322" height="220" rx="10" fill="#F5F6F8" stroke="#0074C8" stroke-width="1.2" /><text x="410" y="349" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >linear_attn</text><text x="704" y="349" class="s" font-size="15.0" fill="#0074C8" text-anchor="end" font-weight="700" >另外 24 层</text><text x="412" y="374" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_qkv</text><text x="702" y="374" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 8192</text><text x="412" y="398" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_z</text><text x="702" y="398" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="412" y="422" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_a   in_proj_b</text><text x="702" y="422" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 32</text><text x="412" y="446" class="m" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="400" >conv1d(k=4)  norm</text><text x="702" y="446" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >不挂 LoRA</text><text x="412" y="470" class="m" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400" >out_proj</text><text x="702" y="470" class="m" font-size="13.6" fill="#6B7280" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="412" y="510" class="s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >GatedDeltaNet：一维卷积 +</text><text x="412" y="529" class="s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >一个随位置递推更新的状态</text><path d="M336 303.0H366.0" stroke="#6B7280" stroke-width="1.6"/><path d="M366.0 194.0V432.0" stroke="#6B7280" stroke-width="1.6"/><path d="M366.0 194.0H396" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><path d="M366.0 432.0H396" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="800" width="690" height="198" rx="12" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="46" y="828" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >mlp 展开：SwiGLU</text><rect x="50" y="866" width="104" height="62" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="102.0" y="894" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >h</text><text x="102.0" y="916" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><rect x="214" y="846" width="152" height="62" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="290.0" y="874" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >gate_proj</text><text x="290.0" y="896" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="214" y="916" width="152" height="62" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="290.0" y="944" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >up_proj</text><text x="290.0" y="966" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="394" y="854" width="86" height="48" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="437.0" y="884.0" class="s" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >SiLU</text><circle cx="529.0" cy="939.0" r="15" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/><text x="529.0" y="946.0" class="s" font-size="18.7" fill="#1A1A1A" text-anchor="middle" font-weight="700" >×</text><rect x="572" y="916" width="152" height="62" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="648.0" y="944" class="m" font-size="17.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >down_proj</text><text x="648.0" y="966" class="m" font-size="15.0" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 4096</text><path d="M154 897.0H176" stroke="#6B7280" stroke-width="1.8"/><path d="M176 877.0V947.0" stroke="#6B7280" stroke-width="1.8"/><path d="M176 877.0H204" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M176 947.0H204" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M366 877.0H384" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M480 878.0H529.0V914" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M366 947.0H504" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M544 939.0H562" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><text x="46" y="984" class="s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >两条并行的线性变换，一条过 SiLU 当门，逐元素乘另一条，再投回 4096。</text><text x="30" y="1028" class="s" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="400" >虚线 = 残差连接：把模块的输出加回它自己的输入。</text><text x="30" y="1052" class="s" font-size="15.0" fill="#6B7280" text-anchor="start" font-weight="400" >绿色 = nn.Linear，LoRA 挂点；灰色是归一化、卷积、激活，没有权重矩阵可拆。</text></svg>
