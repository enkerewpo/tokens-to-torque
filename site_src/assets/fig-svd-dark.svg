<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="SVD 的几何：单位圆经旋转、各方向拉伸、再旋转变成椭圆"><style>.m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}@keyframes pulse{0%,1%{opacity:.3}4%,22%{opacity:1}25%,100%{opacity:.3}}.pu{animation:pulse 8s linear infinite}@media(prefers-reduced-motion:reduce){.pu{animation:none;opacity:1}}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 .5 7 4 0 7.5z" fill="#9AA1A9"/></marker></defs><g transform="translate(100,112)"><path d="M-76 0h152M0 -76v152" stroke="#3A404A" stroke-width="1"/><g transform="rotate(0)"><circle r="44" fill="#76B900" fill-opacity=".16" stroke="#76B900" stroke-width="2.6"/><path d="M0 0h44" stroke="#0074C8" stroke-width="3" stroke-linecap="round"/><path d="M0 0v-44" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/></g></g><text x="100" y="208" class="s pu" font-size="15" fill="#E8E8E8" text-anchor="middle" font-weight="600" style="animation-delay:0s">单位圆</text><path d="M184 112h26" stroke="#9AA1A9" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><g transform="translate(288,112)"><path d="M-76 0h152M0 -76v152" stroke="#3A404A" stroke-width="1"/><g transform="rotate(-34)"><circle r="44" fill="#76B900" fill-opacity=".16" stroke="#76B900" stroke-width="2.6"/><path d="M0 0h44" stroke="#0074C8" stroke-width="3" stroke-linecap="round"/><path d="M0 0v-44" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/></g></g><text x="288" y="208" class="s pu" font-size="15" fill="#E8E8E8" text-anchor="middle" font-weight="600" style="animation-delay:-2s">Vᵀ 旋转</text><path d="M372 112h26" stroke="#9AA1A9" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><g transform="translate(476,112)"><path d="M-76 0h152M0 -76v152" stroke="#3A404A" stroke-width="1"/><g transform="rotate(0) scale(1.55,0.55) rotate(-34)"><circle r="44" fill="#76B900" fill-opacity=".16" stroke="#76B900" stroke-width="2.6"/><path d="M0 0h44" stroke="#0074C8" stroke-width="3" stroke-linecap="round"/><path d="M0 0v-44" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/></g></g><text x="476" y="208" class="s pu" font-size="15" fill="#E8E8E8" text-anchor="middle" font-weight="600" style="animation-delay:-4s">Σ 拉伸</text><path d="M560 112h26" stroke="#9AA1A9" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><g transform="translate(664,112)"><path d="M-76 0h152M0 -76v152" stroke="#3A404A" stroke-width="1"/><g transform="rotate(26) scale(1.55,0.55) rotate(-34)"><circle r="44" fill="#76B900" fill-opacity=".16" stroke="#76B900" stroke-width="2.6"/><path d="M0 0h44" stroke="#0074C8" stroke-width="3" stroke-linecap="round"/><path d="M0 0v-44" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/></g></g><text x="664" y="208" class="s pu" font-size="15" fill="#E8E8E8" text-anchor="middle" font-weight="600" style="animation-delay:-6s">U 再旋转</text><text x="390.0" y="236" class="s" font-size="13" fill="#9AA1A9" text-anchor="middle" font-weight="400" >蓝、橙是一对正交方向；拉伸那步各自乘上一个奇异值。</text></svg>
