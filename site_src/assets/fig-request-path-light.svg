<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 600" width="790" height="600" role="img" aria-label="请求路径：文本进 API 进程分词，作为 Request 经 ZMQ 交给引擎；调度器给出这一步算谁、各几个 token、KV 块在哪；GPU 前向并采样；新 token 回到调度器继续，同时变回文本推给客户端"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="24" y="30" class="t2t-s" font-size="17.9" fill="#1A1A1A" text-anchor="start" font-weight="700" >一条请求走过的对象</text><text x="24" y="52" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >箭头上写的是这一步交给下一个模块的东西</text><rect x="150" y="80" width="248" height="490" rx="10" fill="none" stroke="#D7DBE0" stroke-dasharray="6 5"/><rect x="470" y="80" width="248" height="490" rx="10" fill="none" stroke="#D7DBE0" stroke-dasharray="6 5"/><text x="160" y="98" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >API 进程</text><text x="480" y="98" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >EngineCore 进程</text><rect x="20" y="286" width="108" height="60" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="74.0" y="314" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >用户</text><text x="74.0" y="336" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >prompt</text><rect x="164" y="112" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="274.0" y="140" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >/v1/chat/completions</text><text x="274.0" y="162" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >FastAPI</text><rect x="164" y="204" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="274.0" y="232" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >InputProcessor</text><text x="274.0" y="254" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >分词 + chat template</text><rect x="164" y="296" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="274.0" y="324" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >EngineCoreClient</text><text x="274.0" y="346" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >序列化后经 ZMQ 发出</text><rect x="484" y="204" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="594.0" y="232" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Scheduler</text><text x="594.0" y="254" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >schedule()</text><rect x="164" y="412" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="274.0" y="440" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >OutputProcessor</text><text x="274.0" y="462" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >token → 文本</text><rect x="164" y="500" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="274.0" y="528" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >SSE</text><text x="274.0" y="550" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >逐块推给客户端</text><rect x="484" y="412" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="594.0" y="440" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Scheduler</text><text x="594.0" y="462" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >update_from_output()</text><rect x="484" y="304" width="220" height="76" rx="8" fill="#F5F6F8" stroke="#0074C8" stroke-width="1.2" /><text x="594.0" y="330" class="t2t-m" font-size="16.9" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Worker · GPU</text><text x="594.0" y="351" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="middle" font-weight="400" >CUDA graph 重放一次前向</text><text x="594.0" y="369" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="middle" font-weight="400" >再采样出下一个 token</text><path d="M128 276.0L156 138.0" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="74.0" y="274" class="t2t-s" font-size="13.1" fill="#6B7280" text-anchor="middle" font-weight="400" >文本 + 采样参数</text><path d="M274.0 164L274.0 200" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M274.0 256L274.0 292" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="284.0" y="281.0" class="t2t-s" font-size="13.1" fill="#6B7280" text-anchor="start" font-weight="400" >token ids</text><path d="M384 322.0L476 230.0" stroke="#76B900" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="434.0" y="304.0" class="t2t-m" font-size="13.8" fill="#76B900" text-anchor="middle" font-weight="600" >Request</text><path d="M594.0 256L594.0 300" stroke="#76B900" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="604.0" y="285.0" class="t2t-s" font-size="13.1" fill="#76B900" text-anchor="start" font-weight="400" >SchedulerOutput</text><path d="M594.0 380L594.0 408" stroke="#0074C8" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="604.0" y="401.0" class="t2t-s" font-size="13.1" fill="#0074C8" text-anchor="start" font-weight="400" >新 token 的 id</text><path d="M484 438.0L392 438.0" stroke="#0074C8" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="434.0" y="424.0" class="t2t-m" font-size="13.5" fill="#0074C8" text-anchor="middle" font-weight="600" >EngineCoreOutputs</text><path d="M274.0 464L274.0 496" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M164 526.0L74.0 526.0" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M74.0 520.0L74.0 354" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="82.0" y="514.0" class="t2t-s" font-size="13.1" fill="#6B7280" text-anchor="start" font-weight="400" >一小段文本</text><path d="M704 438.0H734V230.0H710" stroke="#F5A623" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="740" y="327.0" class="t2t-s" font-size="13.1" fill="#F5A623" text-anchor="start" font-weight="400" >没答完</text><text x="740" y="345.0" class="t2t-s" font-size="13.1" fill="#F5A623" text-anchor="start" font-weight="400" >再走一轮</text></svg>
