<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 508" width="750" height="508" role="img" aria-label="静态批处理里短请求算完要空等整批结束；连续批处理每步重新调度，请求答完即离场，新请求立刻补位"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="30" y="34" class="t2t-s" font-size="17.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >为什么连续批处理更快</text><text x="30" y="58" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >横轴是时间步，一格 = 这一步算了这条请求的一个 token</text><text x="30" y="86" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >静态批处理：一批一起开始、一起结束</text><text x="96" y="114.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 1</text><rect x="108" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="137" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="166" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="195" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="224" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="253" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="282" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="311" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="340" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="369" y="96" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><text x="96" y="150.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 2</text><rect x="108" y="132" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="137" y="132" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="166" y="132" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="195" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="224" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="253" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="282" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="311" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="340" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="369" y="132" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><text x="96" y="186.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 3</text><rect x="108" y="168" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="137" y="168" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="166" y="168" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="195" y="168" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="224" y="168" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="253" y="168" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="282" y="168" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="311" y="168" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="340" y="168" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><rect x="369" y="168" width="26" height="26" fill="#6B7280" fill-opacity="0.18"/><text x="96" y="222.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 4</text><text x="108" y="246" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >灰格是空转：请求 2 早就答完了，但要等最长的那条结束才能收批。请求 4 只能排队等下一批。</text><text x="30" y="290" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >连续批处理：每一步重新决定这轮算谁</text><text x="96" y="318.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 1</text><rect x="108" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="137" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="166" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="195" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="224" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="253" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="282" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="311" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="340" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="369" y="300" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><text x="96" y="354.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 2</text><rect x="108" y="336" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="137" y="336" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="166" y="336" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><text x="96" y="390.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 3</text><rect x="108" y="372" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="137" y="372" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="166" y="372" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="195" y="372" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="224" y="372" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><rect x="253" y="372" width="26" height="26" fill="#76B900" fill-opacity="0.8"/><text x="96" y="426.0" class="t2t-m" font-size="12.8" fill="#6B7280" text-anchor="end" font-weight="400" >请求 4</text><rect x="195" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><rect x="224" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><rect x="253" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><rect x="282" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><rect x="311" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><rect x="340" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><rect x="369" y="408" width="26" height="26" fill="#0074C8" fill-opacity="0.8"/><text x="108" y="450" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >请求 2 一答完就离场，空出来的位置立刻让请求 4 补上，GPU 不空转。</text><text x="30" y="484" class="t2t-s" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="700" >调度是逐步做的，不是逐批做的——这是 vLLM 吞吐高的主要原因，day 04 会把这条曲线量出来。</text></svg>
