<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="750" height="500" role="img" aria-label="注意力三步：查询与每个键内积得到分数，softmax 变成和为一的权重，再按权重把各位置的值加权求和"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#9AA1A9"/></marker></defs><text x="30" y="34" class="t2t-s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >注意力的三步</text><text x="30" y="58" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >「它」这个位置去看前面每一个位置，决定各取多少</text><rect x="30" y="82" width="200" height="62" rx="8" fill="#242830" stroke="#F5A623" stroke-width="1.2" /><text x="130.0" y="110" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >q₃ = (1.4, 0.2)</text><text x="130.0" y="132" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >「它」在找什么</text><text x="30" y="176" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >位置</text><text x="150" y="176" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >键 k（我是什么）</text><text x="330" y="176" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >值 v（我给什么）</text><text x="500" y="176" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >分数 q·k/√2</text><text x="620" y="176" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >权重</text><rect x="30" y="194" width="690" height="52" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="46" y="226" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >书</text><text x="150" y="226" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >k₁ = (1, 0)</text><text x="330" y="226" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >v₁ = (2, 0)</text><text x="500" y="226" class="t2t-m" font-size="14.1" fill="#E8E8E8" text-anchor="start" font-weight="400" >0.99</text><rect x="620" y="212" width="42.4" height="18" rx="4" fill="#76B900" fill-opacity=".85"/><text x="706" y="226" class="t2t-m" font-size="12.8" fill="#E8E8E8" text-anchor="end" font-weight="400" >0.53</text><rect x="30" y="256" width="690" height="52" rx="8" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="46" y="288" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >桌</text><text x="150" y="288" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >k₂ = (0, 1)</text><text x="330" y="288" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >v₂ = (0, 2)</text><text x="500" y="288" class="t2t-m" font-size="14.1" fill="#E8E8E8" text-anchor="start" font-weight="400" >0.14</text><rect x="620" y="274" width="18.4" height="18" rx="4" fill="#76B900" fill-opacity=".85"/><text x="706" y="288" class="t2t-m" font-size="12.8" fill="#E8E8E8" text-anchor="end" font-weight="400" >0.23</text><rect x="30" y="318" width="690" height="52" rx="8" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="46" y="350" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >它</text><text x="150" y="350" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >k₃ = (.2, .2)</text><text x="330" y="350" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >v₃ = (.1, .1)</text><text x="500" y="350" class="t2t-m" font-size="14.1" fill="#E8E8E8" text-anchor="start" font-weight="400" >0.23</text><rect x="620" y="336" width="20.0" height="18" rx="4" fill="#76B900" fill-opacity=".85"/><text x="706" y="350" class="t2t-m" font-size="12.8" fill="#E8E8E8" text-anchor="end" font-weight="400" >0.25</text><text x="30" y="404" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >① 打分：查询和每个键做内积，除以 √d 稳定数值</text><text x="30" y="428" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >② softmax：把三个分数变成加起来等于 1 的权重</text><text x="30" y="452" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >③ 加权求和：0.53·v₁ + 0.23·v₂ + 0.25·v₃</text><rect x="430" y="400" width="290" height="66" rx="8" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="575.0" y="428" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >= (1.08, 0.48)</text><text x="575.0" y="450" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >「它」的新表示，主要是「书」</text></svg>
