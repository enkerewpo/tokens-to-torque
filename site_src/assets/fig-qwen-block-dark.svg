<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1118" width="750" height="1118" role="img" aria-label="一个 decoder 块：输入先归一化再过 mixer，结果加回输入；再归一化过 SwiGLU 前馈网络，再加回一次。8 层用 self_attn，24 层用 linear_attn"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#9AA1A9"/></marker></defs><text x="30" y="34" class="t2t-s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >一个 decoder 块的内部</text><text x="30" y="54" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >两种层的骨架完全一样，只有中间的 mixer 不同</text><circle cx="36" cy="113.0" r="3.5" fill="#9AA1A9"/><path d="M36 113.0H14V388.0H170.0" fill="none" stroke="#9AA1A9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qa)"/><circle cx="170.0" cy="388.0" r="3.5" fill="#9AA1A9"/><path d="M170.0 388.0H14V648.0H170.0" fill="none" stroke="#9AA1A9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qa)"/><rect x="36" y="82" width="300" height="62" rx="8" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="186.0" y="110" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >输入 h</text><text x="186.0" y="132" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >4096</text><rect x="36" y="178" width="300" height="56" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="186.0" y="212.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >input_layernorm</text><path d="M186.0 144V178" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><rect x="36" y="268" width="300" height="70" rx="8" fill="#1E222A" stroke="#76B900" stroke-width="1.2" /><text x="186.0" y="296" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >mixer</text><text x="186.0" y="318" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >见右边两种</text><path d="M186.0 234V268" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><circle cx="186.0" cy="388.0" r="16" fill="#242830" stroke="#E8E8E8" stroke-width="1.8"/><text x="186.0" y="395.0" class="t2t-s" font-size="19.2" fill="#E8E8E8" text-anchor="middle" font-weight="700" >+</text><path d="M186.0 338V372" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><rect x="36" y="438" width="300" height="56" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="186.0" y="472.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >post_attention_layernorm</text><path d="M186.0 404V428" stroke="#9AA1A9" stroke-width="1.8" marker-end="url(#qa)"/><rect x="36" y="528" width="300" height="70" rx="8" fill="#242830" stroke="#0074C8" stroke-width="1.2" /><text x="186.0" y="556" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >mlp</text><text x="186.0" y="578" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >SwiGLU，见下方展开</text><path d="M186.0 494V528" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><circle cx="186.0" cy="648.0" r="16" fill="#242830" stroke="#E8E8E8" stroke-width="1.8"/><text x="186.0" y="655.0" class="t2t-s" font-size="19.2" fill="#E8E8E8" text-anchor="middle" font-weight="700" >+</text><path d="M186.0 598V632" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><rect x="36" y="698" width="300" height="62" rx="8" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="186.0" y="726" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >输出 h</text><text x="186.0" y="748" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >4096</text><path d="M186.0 664V688" stroke="#9AA1A9" stroke-width="1.8" marker-end="url(#qa)"/><rect x="396" y="96" width="322" height="196" rx="10" fill="#1E222A" stroke="#F5A623" stroke-width="1.2" /><text x="410" y="123" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >self_attn</text><text x="704" y="123" class="t2t-s" font-size="14.1" fill="#F5A623" text-anchor="end" font-weight="700" >32 层里的 8 层</text><text x="412" y="148" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >q_proj</text><text x="702" y="148" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 8192</text><text x="412" y="172" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >k_proj   v_proj</text><text x="702" y="172" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 1024</text><text x="412" y="196" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >q_norm  k_norm</text><text x="702" y="196" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >无权重矩阵</text><text x="412" y="220" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >o_proj</text><text x="702" y="220" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="412" y="260" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >16 个查询头 / 4 组 KV，每头 256 维</text><text x="412" y="279" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >q_proj 宽一倍：它同时输出一路门控</text><rect x="396" y="322" width="322" height="220" rx="10" fill="#1E222A" stroke="#0074C8" stroke-width="1.2" /><text x="410" y="349" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >linear_attn</text><text x="704" y="349" class="t2t-s" font-size="14.1" fill="#0074C8" text-anchor="end" font-weight="700" >另外 24 层</text><text x="412" y="374" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_qkv</text><text x="702" y="374" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 8192</text><text x="412" y="398" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_z</text><text x="702" y="398" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="412" y="422" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >in_proj_a   in_proj_b</text><text x="702" y="422" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 32</text><text x="412" y="446" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >conv1d(k=4)  norm</text><text x="702" y="446" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >不挂 LoRA</text><text x="412" y="470" class="t2t-m" font-size="14.1" fill="#76B900" text-anchor="start" font-weight="400" >out_proj</text><text x="702" y="470" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="end" font-weight="400" >4096 → 4096</text><text x="412" y="510" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >GatedDeltaNet：一维卷积 +</text><text x="412" y="529" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >一个随位置递推更新的状态</text><path d="M336 303.0H366.0" stroke="#9AA1A9" stroke-width="1.6"/><path d="M366.0 194.0V432.0" stroke="#9AA1A9" stroke-width="1.6"/><path d="M366.0 194.0H396" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><path d="M366.0 432.0H396" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="804" width="690" height="238" rx="12" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="48" y="834" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >mlp 展开：SwiGLU</text><rect x="52" y="874" width="104" height="62" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="104.0" y="902" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >h</text><text x="104.0" y="924" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >4096</text><rect x="218" y="852" width="152" height="62" rx="8" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="294.0" y="880" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >gate_proj</text><text x="294.0" y="902" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="218" y="928" width="152" height="62" rx="8" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="294.0" y="956" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >up_proj</text><text x="294.0" y="978" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="400" y="859" width="86" height="48" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="443.0" y="889.0" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >SiLU</text><circle cx="532.0" cy="959.0" r="16" fill="#242830" stroke="#E8E8E8" stroke-width="1.8"/><text x="532.0" y="966.0" class="t2t-s" font-size="17.6" fill="#E8E8E8" text-anchor="middle" font-weight="700" >×</text><rect x="578" y="928" width="152" height="62" rx="8" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="654.0" y="956" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >down_proj</text><text x="654.0" y="978" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >→ 4096</text><path d="M156 905.0H182" stroke="#9AA1A9" stroke-width="1.6"/><path d="M182 883.0V959.0" stroke="#9AA1A9" stroke-width="1.6"/><path d="M182 883.0H218" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><path d="M182 959.0H218" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><path d="M370 883.0H400" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><path d="M486 883.0H532.0V943.0" fill="none" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><path d="M370 959.0H516" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><path d="M548 959.0H578" stroke="#9AA1A9" stroke-width="1.6" marker-end="url(#qa)"/><text x="48" y="1024" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >两条并行的线性变换，一条过 SiLU 当门，逐元素乘另一条，再投回 4096。</text><text x="30" y="1072" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >虚线 = 残差连接：把模块的输出加回它自己的输入。</text><text x="30" y="1096" class="t2t-s" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >绿色 = nn.Linear，LoRA 挂点；灰色是归一化、卷积、激活，没有权重矩阵可拆。</text></svg>
