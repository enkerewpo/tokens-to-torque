<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" role="img" aria-label="请求路径：文本进 API 进程分词，作为 Request 经 ZMQ 交给引擎；调度器给出这一步算谁、各几个 token、KV 块在哪；GPU 前向并采样；新 token 回到调度器继续，同时变回文本推给客户端"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#9AA1A9"/></marker></defs><text x="24" y="32" class="t2t-s" font-size="19.9" fill="#E8E8E8" text-anchor="start" font-weight="700" >一条请求走过的对象</text><text x="24" y="56" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >箭头旁写的是这一步交给下一个模块的东西</text><rect x="150" y="80" width="268" height="658" rx="10" fill="none" stroke="#3A404A" stroke-dasharray="6 5"/><text x="160" y="100" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >API 进程</text><rect x="498" y="80" width="268" height="658" rx="10" fill="none" stroke="#3A404A" stroke-dasharray="6 5"/><text x="508" y="100" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >EngineCore 进程</text><rect x="26" y="370" width="116" height="64" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="84.0" y="397.0" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >用户</text><text x="84.0" y="419.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >prompt</text><rect x="172" y="124" width="224" height="70" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="284.0" y="154.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >/v1/chat/completions</text><text x="284.0" y="176.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >FastAPI</text><rect x="172" y="250" width="224" height="70" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="284.0" y="280.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >InputProcessor</text><text x="284.0" y="302.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >分词 + chat template</text><rect x="172" y="376" width="224" height="70" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="284.0" y="406.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >EngineCoreClient</text><text x="284.0" y="428.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >序列化后经 ZMQ 发出</text><rect x="520" y="250" width="224" height="70" rx="8" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="632.0" y="280.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >Scheduler</text><text x="632.0" y="302.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >schedule()</text><rect x="172" y="520" width="224" height="70" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="284.0" y="550.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >OutputProcessor</text><text x="284.0" y="572.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >token → 文本</text><rect x="172" y="646" width="224" height="70" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="284.0" y="676.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >SSE</text><text x="284.0" y="698.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >逐块推给客户端</text><rect x="520" y="520" width="224" height="70" rx="8" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="632.0" y="550.0" class="t2t-m" font-size="16.0" fill="#E8E8E8" text-anchor="middle" font-weight="600" >Scheduler</text><text x="632.0" y="572.0" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="middle" font-weight="400" >update_from_output()</text><rect x="520" y="376" width="224" height="96" rx="8" fill="#1E222A" stroke="#0074C8" stroke-width="1.2" /><text x="632.0" y="408" class="t2t-m" font-size="18.8" fill="#E8E8E8" text-anchor="middle" font-weight="600" >Worker · GPU</text><text x="632.0" y="432" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="middle" font-weight="400" >CUDA graph 重放一次前向</text><text x="632.0" y="454" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="middle" font-weight="400" >再采样出下一个 token</text><path d="M142 360L162 169.0" stroke="#9AA1A9" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="84.0" y="344" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="middle" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">文本 + 采样参数</text><path d="M284.0 194L284.0 244" stroke="#9AA1A9" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M284.0 320L284.0 370" stroke="#9AA1A9" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="300.0" y="353.0" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">token ids</text><path d="M402 411.0L510 293.0" stroke="#76B900" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="458.0" y="362" class="t2t-m" font-size="15.8" fill="#76B900" text-anchor="middle" font-weight="600"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Request</text><path d="M632.0 320L632.0 370" stroke="#76B900" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="648.0" y="353.0" class="t2t-s" font-size="15.0" fill="#76B900" text-anchor="start" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">SchedulerOutput</text><path d="M632.0 472L632.0 514" stroke="#0074C8" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="648.0" y="501.0" class="t2t-s" font-size="15.0" fill="#0074C8" text-anchor="start" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">新 token 的 id</text><path d="M514 555.0L406 555.0" stroke="#0074C8" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="458.0" y="506" class="t2t-m" font-size="15.4" fill="#0074C8" text-anchor="middle" font-weight="600"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">EngineCoreOutputs</text><path d="M284.0 590L284.0 640" stroke="#9AA1A9" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M166 681.0L84.0 681.0" stroke="#9AA1A9" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M84.0 673.0L84.0 444" stroke="#9AA1A9" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="94.0" y="667.0" class="t2t-s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">一小段文本</text><path d="M750 555.0H792V285.0H752" stroke="#F5A623" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="802" y="412.0" class="t2t-s" font-size="15.0" fill="#F5A623" text-anchor="start" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">没答完</text><text x="802" y="432.0" class="t2t-s" font-size="15.0" fill="#F5A623" text-anchor="start" font-weight="400"  stroke="#242830" stroke-width="4" stroke-linejoin="round" paint-order="stroke">再走一轮</text></svg>
