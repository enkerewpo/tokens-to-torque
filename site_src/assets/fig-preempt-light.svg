<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-label="抢占示意：正在跑的请求需要新块而缓存已满时，调度器从 running 队尾抢占一条，释放它的块并把已算进度清零，它回到等待队列队首，下一轮从头重算"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="24" y="30" class="t2t-s" font-size="18.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >谁会被抢占</text><text x="24" y="52" class="t2t-s" font-size="14.0" fill="#6B7280" text-anchor="start" font-weight="400" >一个小方块 = 一段 KV 块，缓存总共 8 块。触发抢占的是正在跑的请求要不到新块</text><text x="24" y="106" class="t2t-s" font-size="15.7" fill="#1A1A1A" text-anchor="start" font-weight="600" >① 八块分完，R1 还要一块</text><text x="104" y="142" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R1</text><rect x="116" y="126" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="126" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="168" y="126" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="194" y="126" width="22" height="20" rx="3" fill="none" stroke="#F5A623" stroke-width="1.6"/><text x="205.0" y="141" class="t2t-m" font-size="14.0" fill="#F5A623" text-anchor="middle" font-weight="400" >?</text><text x="232" y="142" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >生成到了块边界，这一步要第 4 块</text><text x="104" y="170" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R2</text><rect x="116" y="154" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="154" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="168" y="154" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><text x="104" y="198" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R3</text><rect x="116" y="182" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="182" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><text x="180" y="198" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >最后进入 running 的一条</text><text x="104" y="226" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >allocate_slots 返回 None：8 块已经分完，没有空闲块给 R1</text><text x="24" y="254" class="t2t-s" font-size="15.7" fill="#1A1A1A" text-anchor="start" font-weight="600" >② 从 running 队尾抢占</text><text x="104" y="290" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R1</text><rect x="116" y="274" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="274" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="168" y="274" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="194" y="274" width="22" height="20" rx="3" fill="none" stroke="#F5A623" stroke-width="1.6"/><text x="205.0" y="289" class="t2t-m" font-size="14.0" fill="#F5A623" text-anchor="middle" font-weight="400" >?</text><text x="104" y="318" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R2</text><rect x="116" y="302" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="302" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="168" y="302" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><text x="104" y="346" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R3</text><rect x="116" y="330" width="22" height="20" rx="3" fill="none" stroke="#D7DBE0" stroke-dasharray="3 3"/><rect x="142" y="330" width="22" height="20" rx="3" fill="none" stroke="#D7DBE0" stroke-dasharray="3 3"/><text x="180" y="346" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >块被释放，num_computed_tokens 归零</text><text x="104" y="374" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >抢的是队尾，也就是最晚进入 running 的 R3；释放后再试一次分配</text><text x="24" y="402" class="t2t-s" font-size="15.7" fill="#1A1A1A" text-anchor="start" font-weight="600" >③ R1 拿到块，R3 回队首等</text><text x="104" y="438" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R1</text><rect x="116" y="422" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="422" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="168" y="422" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="194" y="422" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><text x="232" y="438" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >继续生成</text><text x="104" y="466" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R2</text><rect x="116" y="450" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="142" y="450" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><rect x="168" y="450" width="22" height="20" rx="3" fill="#76B900" fill-opacity=".75"/><text x="104" y="494" class="t2t-m" font-size="14.3" fill="#6B7280" text-anchor="end" font-weight="400" >R3</text><text x="128" y="494" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >在等待队列的队首，下一轮从第 0 个 token 重算</text><text x="104" y="522" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >R3 之前算的那两块作废，这就是抢占的代价</text><text x="24" y="542" class="t2t-s" font-size="13.6" fill="#6B7280" text-anchor="start" font-weight="400" >等待队列里的新请求申请不到块时不会触发抢占，调度器只是这一轮跳过它。</text></svg>
