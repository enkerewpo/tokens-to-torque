<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 560" width="790" height="560" role="img" aria-label="一条请求在 vLLM 引擎里的流动：文本进入 API 进程被分词，作为 Request 经 ZMQ 交给引擎；调度器产出这一步算谁、各算几个 token、KV 块在哪，交给 GPU 做一次前向并采样；新 token 一路回到调度器继续下一步，同时经 OutputProcessor 变回文本推给客户端"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}.gpu{animation:gpuOn 13.0s linear infinite}@keyframes gpuOn{0%,33%{fill-opacity:0;stroke-opacity:0}35%,48%{fill-opacity:.13;stroke-opacity:1}50%,100%{fill-opacity:0;stroke-opacity:0}}@keyframes c0{0%,0.000%{opacity:0;transform:translate(140.0px,248.0px)}0.300%{opacity:1;transform:translate(140.0px,248.0px)}9.700%{opacity:1;transform:translate(158.0px,132.0px)}10.000%,100%{opacity:0;transform:translate(158.0px,132.0px)}}.c0{animation:c0 13.0s linear infinite}@keyframes c1{0%,11.538%{opacity:0;transform:translate(276.0px,226.0px)}11.838%{opacity:1;transform:translate(276.0px,226.0px)}21.238%{opacity:1;transform:translate(276.0px,240.0px)}21.538%,100%{opacity:0;transform:translate(276.0px,240.0px)}}.c1{animation:c1 13.0s linear infinite}@keyframes c2{0%,23.077%{opacity:0;transform:translate(388.0px,268.0px)}23.377%{opacity:1;transform:translate(388.0px,268.0px)}32.777%{opacity:1;transform:translate(432.0px,200.0px)}33.077%,100%{opacity:0;transform:translate(432.0px,200.0px)}}.c2{animation:c2 13.0s linear infinite}@keyframes c3{0%,34.615%{opacity:0;transform:translate(544.0px,226.0px)}34.915%{opacity:1;transform:translate(544.0px,226.0px)}44.315%{opacity:1;transform:translate(544.0px,262.0px)}44.615%,100%{opacity:0;transform:translate(544.0px,262.0px)}}.c3{animation:c3 13.0s linear infinite}@keyframes c4{0%,49.231%{opacity:0;transform:translate(544.0px,346.0px)}49.531%{opacity:1;transform:translate(544.0px,346.0px)}58.931%{opacity:1;transform:translate(544.0px,380.0px)}59.231%,100%{opacity:0;transform:translate(544.0px,380.0px)}}.c4{animation:c4 13.0s linear infinite}@keyframes c5{0%,61.538%{opacity:0;transform:translate(436.0px,408.0px)}61.838%{opacity:1;transform:translate(436.0px,408.0px)}71.238%{opacity:1;transform:translate(392.0px,408.0px)}71.538%,100%{opacity:0;transform:translate(392.0px,408.0px)}}.c5{animation:c5 13.0s linear infinite}@keyframes c6{0%,73.846%{opacity:0;transform:translate(164.0px,476.0px)}74.146%{opacity:1;transform:translate(164.0px,476.0px)}83.546%{opacity:1;transform:translate(120.0px,476.0px)}83.846%,100%{opacity:0;transform:translate(120.0px,476.0px)}}.c6{animation:c6 13.0s linear infinite}.chip{opacity:0}@media (prefers-reduced-motion: reduce){.chip,.gpu{animation:none}.chip{opacity:1}}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="24" y="30" class="t2t-s" font-size="17.9" fill="#1A1A1A" text-anchor="start" font-weight="700" >一条请求在引擎里的流动</text><text x="24" y="52" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >箭头上飞过的方块 = 这一步交给下一个模块的东西</text><rect x="152" y="76" width="248" height="452" rx="10" fill="none" stroke="#D7DBE0" stroke-dasharray="6 5"/><rect x="424" y="76" width="312" height="452" rx="10" fill="none" stroke="#D7DBE0" stroke-dasharray="6 5"/><text x="162" y="94" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >API 进程</text><text x="434" y="94" class="t2t-s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >EngineCore 进程</text><rect x="24" y="250" width="112" height="56" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="80.0" y="278" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >用户</text><text x="80.0" y="300" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >prompt</text><rect x="168" y="110" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="276.0" y="138" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >/v1/chat/completions</text><text x="276.0" y="160" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >FastAPI</text><rect x="168" y="178" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="276.0" y="206" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >InputProcessor</text><text x="276.0" y="228" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >分词 + chat template</text><rect x="168" y="246" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="276.0" y="274" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >EngineCoreClient</text><text x="276.0" y="296" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >序列化后经 ZMQ 发出</text><rect x="440" y="178" width="208" height="44" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="544.0" y="206" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Scheduler</text><text x="544.0" y="228" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >schedule()</text><rect x="168" y="386" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="276.0" y="414" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >OutputProcessor</text><text x="276.0" y="436" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >token → 文本</text><rect x="168" y="454" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="276.0" y="482" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >SSE</text><text x="276.0" y="504" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >逐块推给客户端</text><rect x="440" y="386" width="208" height="44" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="544.0" y="414" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Scheduler</text><text x="544.0" y="436" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >update_from_output()</text><rect x="440" y="268" width="208" height="74" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><rect class="gpu" x="440" y="268" width="208" height="74" rx="8" fill="#76B900" fill-opacity="0" stroke="#76B900" stroke-opacity="0" stroke-width="1.6"/><text x="544.0" y="294" class="t2t-m" font-size="16.9" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Worker · GPU</text><text x="544.0" y="316" class="t2t-s" font-size="13.8" fill="#6B7280" text-anchor="middle" font-weight="400" >CUDA graph 重放一次前向</text><text x="544.0" y="334" class="t2t-s" font-size="13.8" fill="#6B7280" text-anchor="middle" font-weight="400" >再采样出下一个 token</text><path d="M136 248.0L160 132.0" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M276.0 154L276.0 174" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M276.0 222L276.0 242" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M384 268.0L432 200.0" stroke="#76B900" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M544.0 222L544.0 264" stroke="#76B900" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M544.0 342L544.0 382" stroke="#0074C8" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M440 408.0L392 408.0" stroke="#0074C8" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M276.0 430L276.0 450" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M168 476.0L80.0 476.0" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M80.0 470.0L80.0 314" stroke="#6B7280" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><path d="M648 408.0H682V200.0H654" stroke="#F5A623" stroke-width="1.7" fill="none" marker-end="url(#qa)"/><text x="689" y="297.0" class="t2t-s" font-size="13.5" fill="#F5A623" text-anchor="start" font-weight="400" >没答完</text><text x="689" y="315.0" class="t2t-s" font-size="13.5" fill="#F5A623" text-anchor="start" font-weight="400" >再来一步</text><g class="chip c0"><rect x="-33.0" y="-11" width="66.0" height="22" rx="5" fill="#6B7280" fill-opacity=".14" stroke="#6B7280" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="middle" font-weight="400" >文本</text></g><g class="chip c1"><rect x="-33.0" y="-11" width="66.0" height="22" rx="5" fill="#0074C8" fill-opacity=".14" stroke="#0074C8" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#0074C8" text-anchor="middle" font-weight="400" >token ids</text></g><g class="chip c2"><rect x="-33.0" y="-11" width="66.0" height="22" rx="5" fill="#76B900" fill-opacity=".14" stroke="#76B900" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#76B900" text-anchor="middle" font-weight="400" >Request</text></g><g class="chip c3"><rect x="-115.4" y="-11" width="230.8" height="22" rx="5" fill="#76B900" fill-opacity=".14" stroke="#76B900" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#76B900" text-anchor="middle" font-weight="400" >SchedulerOutput：算谁 · 各几个 token · KV 块表</text></g><g class="chip c4"><rect x="-42.6" y="-11" width="85.2" height="22" rx="5" fill="#0074C8" fill-opacity=".14" stroke="#0074C8" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#0074C8" text-anchor="middle" font-weight="400" >新 token 的 id</text></g><g class="chip c5"><rect x="-44.7" y="-11" width="89.4" height="22" rx="5" fill="#0074C8" fill-opacity=".14" stroke="#0074C8" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#0074C8" text-anchor="middle" font-weight="400" >EngineCoreOutputs</text></g><g class="chip c6"><rect x="-33.0" y="-11" width="66.0" height="22" rx="5" fill="#6B7280" fill-opacity=".14" stroke="#6B7280" stroke-width="1"/><text x="0" y="5" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="middle" font-weight="400" >一小段文本</text></g></svg>
