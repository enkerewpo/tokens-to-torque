<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" width="750" height="300" role="img" aria-label="一次 step 分三段：调度在 CPU 上挑出这一步算谁，执行在 GPU 上做一次前向并采样，回写在 CPU 上更新各请求状态"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#9AA1A9"/></marker></defs><text x="24" y="30" class="t2t-s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >一次 step 的三段</text><text x="24" y="52" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >调度和回写在 CPU 上，中间那段在 GPU 上</text><text x="24" y="126" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="600" >CPU</text><line x1="70" y1="121" x2="720" y2="121" stroke="#3A404A" stroke-dasharray="4 4"/><text x="24" y="202" class="t2t-m" font-size="14.1" fill="#9AA1A9" text-anchor="start" font-weight="600" >GPU</text><line x1="70" y1="197" x2="720" y2="197" stroke="#3A404A" stroke-dasharray="4 4"/><rect x="84" y="96" width="190" height="50" rx="7" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="179.0" y="126" class="t2t-m" font-size="14.7" fill="#E8E8E8" text-anchor="middle" font-weight="600" >schedule()</text><rect x="292" y="172" width="250" height="50" rx="7" fill="#242830" stroke="#0074C8" stroke-width="1.2" /><text x="417.0" y="202" class="t2t-m" font-size="14.7" fill="#E8E8E8" text-anchor="middle" font-weight="600" >execute_model()</text><path d="M286 146L312 168" stroke="#9AA1A9" stroke-width="1.5" marker-end="url(#qa)"/><path d="M522 168L548 146" stroke="#9AA1A9" stroke-width="1.5" marker-end="url(#qa)"/><rect x="512" y="96" width="208" height="50" rx="7" fill="#242830" stroke="#76B900" stroke-width="1.2" /><text x="616.0" y="126" class="t2t-m" font-size="14.7" fill="#E8E8E8" text-anchor="middle" font-weight="600" >update_from_output()</text><text x="24" y="254" class="t2t-s" font-size="13.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >实测（Qwen3.5-0.8B，见 §4）：提示 20 个 token 的那一步用了 28.2 ms；之后每步只出一个 token，间隔 10.9 ms</text><text x="24" y="276" class="t2t-s" font-size="13.1" fill="#9AA1A9" text-anchor="start" font-weight="400" >所以一条生成 64 个 token 的请求，要把这三段重复 65 次</text></svg>
