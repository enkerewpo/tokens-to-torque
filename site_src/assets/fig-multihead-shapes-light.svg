<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 896" width="750" height="896" role="img" aria-label="一层注意力里张量形状的变化：(T,4096) 经拆头成 (16,T,256)，算出 (16,T,T) 的权重，输出 (16,T,256)，合头回 (T,4096)"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="30" y="34" class="t2t-s" font-size="17.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >一层注意力里，形状怎么变</text><text x="30" y="58" class="t2t-s" font-size="14.1" fill="#6B7280" text-anchor="start" font-weight="400" >T = 这次输入的 token 数；16 个头 × 每头 256 维 = 4096</text><rect x="30" y="84" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="46" y="118.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >输入 h</text><rect x="316" y="92" width="170" height="40" rx="6" fill="#0074C8" fill-opacity=".12" stroke="#0074C8" stroke-width="1.2"/><text x="401" y="118.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(T, 4096)</text><text x="502" y="118.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >每个位置一个 4096 维向量</text><path d="M164.0 140V170" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="170" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="46" y="204.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >q  k  v</text><rect x="316" y="178" width="170" height="40" rx="6" fill="#0074C8" fill-opacity=".12" stroke="#0074C8" stroke-width="1.2"/><text x="401" y="204.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(T, 4096) 各一个</text><text x="502" y="204.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >各乘 W_Q / W_K / W_V</text><path d="M164.0 226V256" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="256" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.2" /><text x="46" y="290.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >拆头（reshape）</text><rect x="316" y="264" width="170" height="40" rx="6" fill="#F5A623" fill-opacity=".12" stroke="#F5A623" stroke-width="1.2"/><text x="401" y="290.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(16, T, 256)</text><text x="502" y="290.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >4096 拆成 16 × 256</text><path d="M164.0 312V342" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="342" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="46" y="376.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >分数 = q @ kᵀ / √256</text><rect x="316" y="350" width="170" height="40" rx="6" fill="#76B900" fill-opacity=".12" stroke="#76B900" stroke-width="1.2"/><text x="401" y="376.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(16, T, T)</text><text x="502" y="376.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >每个头一张 T×T 表</text><path d="M164.0 398V428" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="428" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="46" y="462.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >加因果掩码，逐行 softmax</text><rect x="316" y="436" width="170" height="40" rx="6" fill="#76B900" fill-opacity=".12" stroke="#76B900" stroke-width="1.2"/><text x="401" y="462.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(16, T, T)</text><text x="502" y="462.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >形状不变，每行和为 1</text><path d="M164.0 484V514" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="514" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="46" y="548.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >权重 @ v</text><rect x="316" y="522" width="170" height="40" rx="6" fill="#76B900" fill-opacity=".12" stroke="#76B900" stroke-width="1.2"/><text x="401" y="548.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(16, T, 256)</text><text x="502" y="548.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >每个头输出 256 维</text><path d="M164.0 570V600" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="600" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.2" /><text x="46" y="634.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >合头（reshape）</text><rect x="316" y="608" width="170" height="40" rx="6" fill="#F5A623" fill-opacity=".12" stroke="#F5A623" stroke-width="1.2"/><text x="401" y="634.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(T, 4096)</text><text x="502" y="634.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >16 × 256 拼回 4096</text><path d="M164.0 656V686" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="30" y="686" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="46" y="720.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="600" >× W_O（o_proj）</text><rect x="316" y="694" width="170" height="40" rx="6" fill="#0074C8" fill-opacity=".12" stroke="#0074C8" stroke-width="1.2"/><text x="401" y="720.0" class="t2t-m" font-size="14.1" fill="#1A1A1A" text-anchor="middle" font-weight="700" >(T, 4096)</text><text x="502" y="720.0" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >4096 × 4096 的矩阵</text><text x="30" y="796" class="t2t-s" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="700" >进来 (T, 4096)，出去还是 (T, 4096)——注意力不改变形状，只改变内容。</text><text x="30" y="822" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >橙色那两步只是换个看法（reshape），一次乘法都没有；真正的计算在绿色三步和两端的矩阵乘法里。</text><text x="30" y="846" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >这个模型用 GQA：k、v 只有 4 组，形状是 (4, T, 256)，算的时候一组给 4 个查询头共用。</text><text x="30" y="872" class="t2t-s" font-size="12.8" fill="#6B7280" text-anchor="start" font-weight="400" >@ 是 Python 的矩阵乘法运算符（a @ b 即矩阵 a 乘矩阵 b）；kᵀ 是 k 的转置，行列互换。</text></svg>
