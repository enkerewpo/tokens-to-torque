<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 844" width="560" height="844" role="img" aria-label="Qwen3.5-9B 的主干：token ids 经 embedding、32 个 decoder 块、RMSNorm、lm_head，得到 logits 再 softmax 成下一个 token 的概率分布"><style>.m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 1 10 5.5 0 10z" fill="#6B7280"/></marker></defs><text x="30" y="32" class="s" font-size="16" fill="#1A1A1A" text-anchor="start" font-weight="700" >整体通路</text><rect x="150" y="56" width="260" height="56" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="280.0" y="81" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >token ids</text><text x="280.0" y="100" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >一句话被切成的整数序列</text><rect x="150" y="138" width="260" height="56" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="280.0" y="163" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >embed_tokens</text><text x="280.0" y="182" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >248320 × 4096</text><path d="M280.0 112V128" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="134" y="204" width="292" height="256" rx="12" fill="none" stroke="#D7DBE0" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="150" y="220" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="280.0" y="247.5" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >线性注意力块</text><rect x="150" y="280" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="280.0" y="307.5" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >线性注意力块</text><path d="M280.0 264V270" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="150" y="340" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="280.0" y="367.5" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >线性注意力块</text><path d="M280.0 324V330" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="150" y="400" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.2" /><text x="280.0" y="427.5" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >全注意力块</text><path d="M280.0 384V390" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><path d="M280.0 194V210" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><text x="440" y="324.0" class="s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >这 4 层一组</text><text x="440" y="344.0" class="s" font-size="13.5" fill="#1A1A1A" text-anchor="start" font-weight="700" >重复 8 次 = 32 层</text><rect x="150" y="486" width="260" height="56" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="280.0" y="511" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >model.norm</text><text x="280.0" y="530" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >RMSNorm</text><path d="M280.0 444V476" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="150" y="568" width="260" height="56" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="280.0" y="593" class="m" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >lm_head</text><text x="280.0" y="612" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >4096 → 248320</text><path d="M280.0 542V558" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><text x="424" y="601.0" class="s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >LoRA 跳过它</text><rect x="150" y="650" width="260" height="56" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="280.0" y="675" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >logits</text><text x="280.0" y="694" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >每个词一个分数，248320 个</text><path d="M280.0 624V640" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><rect x="150" y="732" width="260" height="56" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="280.0" y="757" class="s" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >softmax → 概率分布</text><text x="280.0" y="776" class="m" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="400" >从这里采样出下一个 token</text><path d="M280.0 706V722" stroke="#6B7280" stroke-width="1.8" marker-end="url(#qa)"/><text x="30" y="822" class="s" font-size="13.5" fill="#6B7280" text-anchor="start" font-weight="400" >每生成一个 token，整条通路就从上到下走一遍。</text></svg>
