" >隐藏维 d_model</text><text x="931" y="670" class="m" font-size="11.5" fill="#1A1A1A" text-anchor="end" font-weight="400" >4096</text><text x="736" y="690" class="s" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >FFN 中间维</text><text x="931" y="690" class="m" font-size="11.5" fill="#1A1A1A" text-anchor="end" font-weight="400" >12288</text><text x="941" y="650" class="s" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >层数</text><text x="1136" y="650" class="m" font-size="11.5" fill="#1A1A1A" text-anchor="end" font-weight="400" >32（24 线性 + 8 全）</text><text x="941" y="670" class="s" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >头</text><text x="1136" y="670" class="m" font-size="11.5" fill="#1A1A1A" text-anchor="end" font-weight="400" >16 查询 / 4 KV × 256</text><text x="941" y="690" class="s" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >最大位置</text><text x="1136" y="690" class="m" font-size="11.5" fill="#1A1A1A" text-anchor="end" font-weight="400" >262144</text><text x="736" y="732" class="s" font-size="12" fill="#76B900" text-anchor="start" font-weight="700" >绿色 = nn.Linear，LoRA 挂点（248 个）</text><text x="736" y="748" class="s" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >灰色 = 归一化 / 卷积 / 激活，没有权重矩阵可拆</text></svg>
