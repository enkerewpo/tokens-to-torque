）</text><text x="764.0" y="484" class="m" font-size="11.5" fill="#76B900" text-anchor="start" font-weight="400" >gate_proj  up_proj  down_proj</text><text x="1056.0" y="484" class="m" font-size="11" fill="#6B7280" text-anchor="end" font-weight="400" >4096 ↔ 12288</text><path d="M910.0 504V517" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><circle cx="910.0" cy="540" r="13" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.6"/><text x="910.0" y="545" class="s" font-size="16" fill="#1A1A1A" text-anchor="middle" font-weight="700" >+</text><text x="910.0" y="574" class="m" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400" >输出 h（4096）</text><rect x="40" y="604" width="640" height="150" rx="12" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="56" y="628" class="s" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="700" >mlp 展开：SwiGLU</text><rect x="60" y="661" width="96" height="44" rx="7" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1.2" /><text x="108.0" y="680" class="m" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="600" >h</text><text x="108.0" y="696" class="m" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400" >4096</text><path d="M156 683h18" stroke="#6B7280" stroke-width="1.6"/><path d="M174 665V711" stroke="#6B7280" stroke-width="1.6"/><path d="M174 665h10" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><path d="M174 711h10" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="188" y="643" width="128" height="44" rx="7" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="252.0" y="662" class="m" font-size="13" fill="#1A1A1A" text-anchor="middle" font-weight="600" >gate_proj</text><text x="252.0" y="678" class="m" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="400" >→ 12288</text><rect x="188" y="689" width="128" height="44" rx="7" fill="#FFFFFF" stroke="#76B900" stroke-width="1.2" /><text x="252.0" y="708" class="m" fon