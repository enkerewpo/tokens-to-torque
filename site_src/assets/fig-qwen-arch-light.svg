<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1026" width="750" height="1026" role="img" aria-label="Qwen3.5-9B 的主干：token ids 经 embedding、32 个 decoder 块、RMSNorm、lm_head，得到 logits 再 softmax 成下一个 token 的概率分布"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#6B7280"/></marker></defs><text x="30" y="34" class="t2t-s" font-size="17.0" fill="#1A1A1A" text-anchor="start" font-weight="700" >整体通路</text><rect x="205" y="56" width="340" height="64" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="375.0" y="84" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >token ids</text><text x="375.0" y="106" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >一句话被切成的整数序列</text><rect x="205" y="154" width="340" height="64" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="375.0" y="182" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >embed_tokens</text><text x="375.0" y="204" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >248320 × 4096</text><path d="M375.0 120V154" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="189" y="236" width="372" height="342" rx="12" fill="none" stroke="#D7DBE0" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="205" y="252" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="375.0" y="284.0" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >线性注意力块</text><rect x="205" y="338" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="375.0" y="370.0" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >线性注意力块</text><path d="M375.0 304V338" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="205" y="424" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#0074C8" stroke-width="1.2" /><text x="375.0" y="456.0" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >线性注意力块</text><path d="M375.0 390V424" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="205" y="510" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#F5A623" stroke-width="1.2" /><text x="375.0" y="542.0" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >全注意力块</text><path d="M375.0 476V510" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><path d="M375.0 218V252" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><text x="575" y="399.0" class="t2t-s" font-size="14.1" fill="#6B7280" text-anchor="start" font-weight="400" >这 4 层一组</text><text x="575" y="419.0" class="t2t-s" font-size="14.1" fill="#1A1A1A" text-anchor="start" font-weight="700" >重复 8 次 = 32 层</text><rect x="205" y="612" width="340" height="64" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="375.0" y="640" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >model.norm</text><text x="375.0" y="662" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >RMSNorm</text><path d="M375.0 562V612" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="205" y="710" width="340" height="64" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="375.0" y="738" class="t2t-m" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >lm_head</text><text x="375.0" y="760" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >4096 → 248320</text><path d="M375.0 676V710" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><text x="559" y="747.0" class="t2t-s" font-size="14.1" fill="#6B7280" text-anchor="start" font-weight="400" >LoRA 跳过它</text><rect x="205" y="808" width="340" height="64" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="375.0" y="836" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >logits</text><text x="375.0" y="858" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >每个词一个分数，248320 个</text><path d="M375.0 774V808" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><rect x="205" y="906" width="340" height="64" rx="8" fill="#F5F6F8" stroke="#D7DBE0" stroke-width="1.2" /><text x="375.0" y="934" class="t2t-s" font-size="16.0" fill="#1A1A1A" text-anchor="middle" font-weight="600" >softmax → 概率分布</text><text x="375.0" y="956" class="t2t-m" font-size="14.1" fill="#6B7280" text-anchor="middle" font-weight="400" >从这里采样出下一个 token</text><path d="M375.0 872V906" stroke="#6B7280" stroke-width="1.6" marker-end="url(#qa)"/><text x="30" y="1004" class="t2t-s" font-size="14.1" fill="#6B7280" text-anchor="start" font-weight="400" >每生成一个 token，整条通路就从上到下走一遍。</text></svg>
