<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 408" width="750" height="408" role="img" aria-label="按最大长度预留会白占大量缓存；分页按需分配固定大小的块，块之间不必连续，相同前缀还能共享"><style>.t2t-m{font-family:"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.t2t-s{font-family:"Noto Sans CJK SC","Noto Sans SC Variable","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#9AA1A9"/></marker></defs><text x="30" y="34" class="t2t-s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >KV cache 为什么要分页</text><text x="30" y="58" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >一条请求最终要多长的缓存，发的时候并不知道</text><text x="30" y="96" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >按最大长度预留</text><rect x="30" y="112" width="330" height="30" fill="#9AA1A9" fill-opacity=".15"/><rect x="30" y="112" width="82" height="30" fill="#0074C8" fill-opacity=".8"/><text x="370" y="132.0" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >请求 1</text><rect x="30" y="154" width="330" height="30" fill="#9AA1A9" fill-opacity=".15"/><rect x="30" y="154" width="148" height="30" fill="#0074C8" fill-opacity=".8"/><text x="370" y="174.0" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >请求 2</text><rect x="30" y="196" width="330" height="30" fill="#9AA1A9" fill-opacity=".15"/><rect x="30" y="196" width="50" height="30" fill="#0074C8" fill-opacity=".8"/><text x="370" y="216.0" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >请求 3</text><text x="30" y="250" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >蓝色是真的用上的，灰色是白占的</text><text x="470" y="96" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >分页</text><rect x="470" y="112" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="510" y="112" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="550" y="112" width="34" height="30" fill="#76B900" fill-opacity=".75"/><text x="678" y="132.0" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >3 块</text><rect x="470" y="154" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="510" y="154" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="550" y="154" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="590" y="154" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="630" y="154" width="34" height="30" fill="#76B900" fill-opacity=".75"/><text x="678" y="174.0" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >5 块</text><rect x="470" y="196" width="34" height="30" fill="#76B900" fill-opacity=".75"/><rect x="510" y="196" width="34" height="30" fill="#76B900" fill-opacity=".75"/><text x="678" y="216.0" class="t2t-m" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >2 块</text><text x="470" y="250" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >按需要一块块拿，用完就还</text><rect x="30" y="282" width="690" height="96" rx="10" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="46" y="310" class="t2t-s" font-size="16.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >块不必挨着放</text><text x="46" y="334" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >每条请求带一张表，记着自己的块按什么顺序拼起来——和操作系统的虚拟内存分页是同一个套路。</text><text x="46" y="358" class="t2t-s" font-size="12.8" fill="#9AA1A9" text-anchor="start" font-weight="400" >好处：几乎没有白占的空间；两条请求前缀相同时，还能共用同一批块。</text></svg>
