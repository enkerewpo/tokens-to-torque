<script>
// 接管导航栏那个切换按钮。
//
// 只有两档：跟随系统，和“钉住与系统相反的那个外观”。这样**每一下都有肉眼
// 可见的变化**。三档（跟随系统 / 浅色 / 深色）看着更全，但其中必有一档和当前
// 外观相同，切过去毫无变化，用起来就像按钮坏了——那是上一版的毛病。
// 钉住和系统同色的那一档也没有意义：跟随系统时本来就是那个颜色。
(function () {
  var t = window.t2tTheme;
  if (!t || typeof window.quartoToggleColorScheme !== "function") return;
  var flip = window.quartoToggleColorScheme;
  var NAME = { light: "浅色", dark: "深色" };

  function isDark() { return document.body.classList.contains("quarto-dark"); }

  // 换主题会重排页面，headroom（顶栏的自动隐藏）有时会把它判成“向下滚动”
  // 而收起来。切换后把它按回固定状态；下一次真的滚动时 headroom 自己会接管。
  function repin() {
    var h = document.getElementById("quarto-header");
    if (h && h.classList.contains("headroom")) {
      h.classList.remove("headroom--unpinned");
      h.classList.add("headroom--pinned");
    }
    var els = document.querySelectorAll(".sidebar, .headroom-target");
    for (var i = 0; i < els.length; i++) els[i].classList.remove("sidebar-unpinned");
  }
  function pinned() { return t.sysDark() ? "light" : "dark"; }   // 与系统相反的那档

  function label() {
    var m = t.mode();
    var txt = m === "auto"
      ? "主题：跟随系统（" + NAME[t.sysDark() ? "dark" : "light"] + "）· 点击切到" + NAME[pinned()]
      : "主题：" + NAME[m] + " · 点击回到跟随系统";
    var els = document.querySelectorAll(".quarto-color-scheme-toggle");
    for (var i = 0; i < els.length; i++) {
      els[i].setAttribute("title", txt);
      els[i].setAttribute("aria-label", txt);
      els[i].setAttribute("data-theme-mode", m);
    }
  }

  function goto(m) {
    try { localStorage.setItem(t.MODE, m); } catch (e) {}
    // 顺序要紧：flip() 是按哨兵值取反的，而哨兵值此刻还等于页面当前状态。
    // 先写哨兵再 flip，会被它取反回原状态。
    if (t.wantDark(m) !== isDark()) flip();
    t.apply(m);
    label();
    repin();
  }

  window.quartoToggleColorScheme = function () {
    goto(t.mode() === "auto" ? pinned() : "auto");
  };

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (t.mode() !== "auto") return;   // 钉住时不跟随
      if (e.matches !== isDark()) flip();
      t.apply("auto");
      label();
      repin();
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  label();
})();
</script>
