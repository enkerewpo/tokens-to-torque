<script>
// 接管导航栏那个切换按钮，让它在 跟随系统 / 浅色 / 深色 三档之间循环。
// 只调用 Quarto 的公开函数 window.quartoToggleColorScheme()：它按哨兵值翻转，
// 而哨兵值和页面当前状态始终一致，所以“需要变就翻一次”是安全的。
(function () {
  var t = window.t2tTheme;
  if (!t || typeof window.quartoToggleColorScheme !== "function") return;
  var LABEL = { auto: "跟随系统", light: "浅色", dark: "深色" };
  var flip = window.quartoToggleColorScheme;

  function isDark() { return document.body.classList.contains("quarto-dark"); }

  // 顺序不能写死成 跟随系统 → 浅色 → 深色：系统本来就是浅色时，第一下切到
  // “浅色”外观没有任何变化，看起来就像按钮坏了。改成第一下必定切到与当前
  // 相反的那一档，第三下回到跟随系统。
  function mode() { return t.mode(); }
  function sysDark() { return t.sysDark(); }

  function label(m) {
    var txt = "主题：" + LABEL[m] + "（点击切到" + LABEL[nextModeFrom(m)] + "）";
    var els = document.querySelectorAll(".quarto-color-scheme-toggle");
    for (var i = 0; i < els.length; i++) {
      els[i].setAttribute("title", txt);
      els[i].setAttribute("aria-label", txt);
      els[i].setAttribute("data-theme-mode", m);
    }
  }

  function nextModeFrom(m) {
    if (m === "auto") return sysDark() ? "light" : "dark";
    var other = sysDark() ? "dark" : "light";
    return m === other ? "auto" : other;
  }

  function goto(m) {
    try { localStorage.setItem(t.MODE, m); } catch (e) {}
    // 顺序要紧：flip() 是按哨兵值取反的，而哨兵值此刻还等于页面当前状态。
    // 先写哨兵再 flip，会被它取反回原状态。
    if (t.wantDark(m) !== isDark()) flip();
    t.apply(m);
    label(m);
  }

  window.quartoToggleColorScheme = function () { goto(nextModeFrom(mode())); };

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (t.mode() !== "auto") return;
      if (e.matches !== isDark()) flip();
      t.apply("auto");
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  label(t.mode());
})();
</script>
