<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 494" width="750" height="494" role="img" aria-label="prefill 一次算完整个输入并把 K、V 存进缓存；decode 每步只算一个新位置，读缓存再追加"><style>.m{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif}</style><defs><marker id="qa" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0.8 8 4.5 0 8.2z" fill="#9AA1A9"/></marker></defs><text x="30" y="34" class="s" font-size="18.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >推理的两个阶段与 KV cache</text><text x="30" y="76" class="s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >prefill：把输入的 5 个 token 一次算完</text><text x="30" y="100" class="s" font-size="13.6" fill="#9AA1A9" text-anchor="start" font-weight="400" >大矩阵乘法，吃算力</text><rect x="30" y="116" width="52" height="40" rx="6" fill="none" stroke="#76B900" stroke-width="2" stroke-dasharray="5 4"/><text x="56.0" y="142" class="m" font-size="13.6" fill="#76B900" text-anchor="middle" font-weight="400" >K1</text><rect x="90" y="116" width="52" height="40" rx="6" fill="none" stroke="#76B900" stroke-width="2" stroke-dasharray="5 4"/><text x="116.0" y="142" class="m" font-size="13.6" fill="#76B900" text-anchor="middle" font-weight="400" >K2</text><rect x="150" y="116" width="52" height="40" rx="6" fill="none" stroke="#76B900" stroke-width="2" stroke-dasharray="5 4"/><text x="176.0" y="142" class="m" font-size="13.6" fill="#76B900" text-anchor="middle" font-weight="400" >K3</text><rect x="210" y="116" width="52" height="40" rx="6" fill="none" stroke="#76B900" stroke-width="2" stroke-dasharray="5 4"/><text x="236.0" y="142" class="m" font-size="13.6" fill="#76B900" text-anchor="middle" font-weight="400" >K4</text><rect x="270" y="116" width="52" height="40" rx="6" fill="none" stroke="#76B900" stroke-width="2" stroke-dasharray="5 4"/><text x="296.0" y="142" class="m" font-size="13.6" fill="#76B900" text-anchor="middle" font-weight="400" >K5</text><text x="340" y="142" class="s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >K、V 存进缓存</text><text x="30" y="214" class="s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >decode：每步只算 1 个新位置</text><text x="30" y="238" class="s" font-size="13.6" fill="#9AA1A9" text-anchor="start" font-weight="400" >矩阵乘向量，算得少、读得多，吃带宽</text><rect x="30" y="254" width="52" height="40" rx="6" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="56.0" y="280" class="m" font-size="13.6" fill="#9AA1A9" text-anchor="middle" font-weight="400" >K1</text><rect x="90" y="254" width="52" height="40" rx="6" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="116.0" y="280" class="m" font-size="13.6" fill="#9AA1A9" text-anchor="middle" font-weight="400" >K2</text><rect x="150" y="254" width="52" height="40" rx="6" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="176.0" y="280" class="m" font-size="13.6" fill="#9AA1A9" text-anchor="middle" font-weight="400" >K3</text><rect x="210" y="254" width="52" height="40" rx="6" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="236.0" y="280" class="m" font-size="13.6" fill="#9AA1A9" text-anchor="middle" font-weight="400" >K4</text><rect x="270" y="254" width="52" height="40" rx="6" fill="#242830" stroke="#3A404A" stroke-width="1.2" /><text x="296.0" y="280" class="m" font-size="13.6" fill="#9AA1A9" text-anchor="middle" font-weight="400" >K5</text><rect x="330" y="254" width="52" height="40" rx="6" fill="none" stroke="#76B900" stroke-width="2" stroke-dasharray="5 4"/><text x="356.0" y="280" class="m" font-size="13.6" fill="#76B900" text-anchor="middle" font-weight="400" >K6</text><text x="400" y="280" class="s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >读已有的 5 个，追加第 6 个</text><text x="30" y="320" class="s" font-size="13.6" fill="#9AA1A9" text-anchor="start" font-weight="400" >绿色虚线 = 这一步新算出来的；灰色实线 = 缓存里已经有的</text><text x="30" y="348" class="s" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >重算一遍要 O(T²)，缓存下来每步只要 O(T)——代价是显存里多一块随长度增长的缓存。</text><rect x="30" y="368" width="690" height="96" rx="10" fill="#1E222A" stroke="#3A404A" stroke-width="1.2" /><text x="48" y="398" class="s" font-size="17.0" fill="#E8E8E8" text-anchor="start" font-weight="700" >每 token 每层要存多少</text><text x="48" y="424" class="m" font-size="15.0" fill="#9AA1A9" text-anchor="start" font-weight="400" >2（K 和 V）× KV 头数 × 每头维度 × 每个数的字节数</text><text x="48" y="448" class="s" font-size="13.6" fill="#9AA1A9" text-anchor="start" font-weight="400" >Qwen3.5-9B 全注意力层：2 × 4 × 256 × 2 = 4 KB；32 层里只有 8 层是全注意力，所以每 token 32 KB</text></svg>
